plugins {
    alias libs.plugins.android.application
    alias libs.plugins.google.services
    alias libs.plugins.google.secrets
}

android {
    namespace "io.kommunicate.app"
    compileSdk 36

    defaultConfig {
        applicationId "io.kommunicate.app"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "APP_ID", '"<<YOUR_APP_ID>>"'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    lintOptions {
        baseline file("lint-baseline.xml")
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':kommunicateui')
//    implementation 'io.kommunicate.sdk:kommunicateui:2.16.8'
    implementation libs.appcompat
    implementation libs.core.ktx
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
    implementation libs.material
    testImplementation libs.junit
    testImplementation libs.java.client
    testImplementation libs.selenium.java
    testImplementation libs.robolectric
    androidTestImplementation libs.espresso.contrib
    androidTestImplementation libs.espresso.intents
    androidTestImplementation libs.test.core.ktx
    androidTestImplementation libs.rules
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.runner
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.web
}

secrets {
    defaultPropertiesFileName = "release.secrets.properties"
}
